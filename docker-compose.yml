version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vyaparguard-postgres
    environment:
      POSTGRES_DB: vyaparguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vyaparguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vyaparguard-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vyaparguard
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vyaparguard-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
